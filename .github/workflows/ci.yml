name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci || npm install
      - name: Run tests
        run: npm test
      - name: Run Integrity Checks
        run: node evals/eval_runner.js --check
      - name: Verify manifest
        run: node scripts/generate-manifest.js --verify
        continue-on-error: true  # manifest may not exist yet during development

  references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reference integrity (WCAG, laws, scoring)
        run: node --test tests/references.test.js
      - name: Output schema validation
        run: node --test tests/output-schema.test.js
      - name: Eval runner integrity
        run: node evals/eval_runner.js --check

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version consistency
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          SKILL_VERSION=$(grep -oP 'version:\s*"?\K[0-9]+\.[0-9]+\.[0-9]+' SKILL.md | head -1)
          echo "package.json: $PKG_VERSION"
          echo "SKILL.md: $SKILL_VERSION"
          if [ "$PKG_VERSION" != "$SKILL_VERSION" ]; then
            echo "::error::Version mismatch: package.json ($PKG_VERSION) != SKILL.md ($SKILL_VERSION)"
            exit 1
          fi
          echo "✓ Versions match: $PKG_VERSION"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"
        continue-on-error: true  # warnings only

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run npm audit
        run: npm audit
        continue-on-error: true
      - name: Secret Scanning
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  publish-check:
    runs-on: ubuntu-latest
    needs: [test, references]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify npm pack
        run: |
          npm pack --dry-run 2>&1 | tee pack-output.txt
          echo "✓ Pack dry-run successful"
      - name: Check all package files exist
        run: |
          node -e "
            const pkg = require('./package.json');
            const fs = require('fs');
            const path = require('path');
            let ok = true;
            for (const f of pkg.files) {
              if (!fs.existsSync(f)) {
                console.error('Missing: ' + f);
                ok = false;
              } else {
                console.log('  ✓ ' + f);
              }
            }
            if (!ok) process.exit(1);
            console.log('✓ All package files present');
          "
